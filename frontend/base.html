<style>

  --neg:#9E2A20; --neg-soft:#FAE6E3; --info:#2B4570; --info-soft:#E3E9F3; --mute-soft:#E7EAEE;
  --focus:#3F3FB5;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --sh-raise:0 1px 2px rgba(19,27,36,.05),0 8px 22px -14px rgba(19,27,36,.2);

}
:root[data-theme="dark"]{

  --ink:#E8ECF2; --ink-2:#AEB8C4; --ink-3:#8D98A6; --line:#262E39; --line-strong:#38424F;

  --neg:#F48E82; --neg-soft:#3A1C19; --info:#9DB7E6; --info-soft:#1A2538; --mute-soft:#222A34;

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.012em;font-weight:700}
h1{font-size:var(--t-2xl)} h2{font-size:var(--t-xl)} h3{font-size:var(--t-lg)} h4{font-size:var(--t-md)}

a{color:inherit}

svg{flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.topbar{position:sticky;top:0;z-index:40;height:var(--top-h);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}

.mark{width:28px;height:28px;display:block}
.grow{flex:1;min-width:0}
.env{font-size:var(--t-xs);font-weight:600;padding:2px 9px;border-radius:var(--r-pill);border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}

  nav.tabs .side-brand{display:flex}

  nav.tabs a.tab:hover{background:var(--mute-soft);color:var(--ink)}
  nav.tabs a.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}

}

.stack>*+*{margin-top:var(--s4)} .stack-lg>*+*{margin-top:var(--s6)}
.row{display:flex;align-items:center;gap:var(--s3);min-width:0} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.muted{color:var(--ink-2)} .small{font-size:var(--t-sm)} .xs{font-size:var(--t-xs);color:var(--ink-3)}

.addr{word-break:break-all}
.break{overflow-wrap:anywhere}
.measure{max-width:62ch}
.pagehead{display:grid;gap:var(--s2);margin-bottom:var(--s6)}

@media (max-width:420px){.panel{padding:var(--s4)}}

.callout{border-left:3px solid var(--sig);background:var(--sig-soft);padding:var(--s3) var(--s4);border-radius:0 var(--r-md) var(--r-md) 0;font-size:var(--t-sm)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)} .callout.bad{border-color:var(--neg);background:var(--neg-soft)} .callout.ok{border-color:var(--pos);background:var(--pos-soft)}
.cols{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1fr)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;text-align:center;line-height:1.25;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}

.field{display:block} .field+.field{margin-top:var(--s4)}
.field>label,.label{display:block;font-size:var(--t-sm);font-weight:600;margin-bottom:6px}
.req{color:var(--neg);margin-left:2px}
.input{width:100%;min-height:44px;padding:10px 12px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);appearance:none;-webkit-appearance:none}
.input:hover{border-color:var(--ink-3)}

.seg{display:flex;flex-wrap:wrap;gap:var(--s2)}

.chip.neg{background:var(--neg-soft);color:var(--neg)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.sig{background:var(--sig-soft);color:var(--sig)}

.kv{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:10px 16px;margin:0}

.card{--edge:var(--line-strong);display:grid;gap:8px;padding:var(--s4) var(--s5);background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--edge);border-radius:var(--r-lg);text-decoration:none;color:var(--ink);min-width:0;box-shadow:var(--sh-raise)}

.card.e-pos{--edge:var(--pos)} .card.e-warn{--edge:var(--warn)} .card.e-neg{--edge:var(--neg)} .card.e-sig{--edge:var(--sig)} .card.e-info{--edge:var(--info)}

function timelineFor(d) {
  const rows = [["Offer listed", d.created_at, ""]];
  if (d.claimed_at) rows.push(["Payment claimed", d.claimed_at, d.payment_ref ? "Reference: " + d.payment_ref : ""]);
  else if (d.rejections) rows.push(["Claim rejected", 0, d.reject_reason ? "Reason: " + d.reject_reason : ""]);
  if (d.bound_at) rows.push([d.bound_by === "seller" ? "Vendor confirmed payment" : "Bound after the vendor stayed silent", d.bound_at, ""]);
  if (d.delivered_at) rows.push(["Vendor posted delivery proof", d.delivered_at, ""]);
  if (d.dispute_opened_at) rows.push(["Dispute opened", d.dispute_opened_at, ""]);
  if (d.status === "PAYOUT_PENDING") rows.push(["Payout waiting for challenge window", d.unlock_at, "Unlocks " + fmtEpoch(d.unlock_at)]);
  if (d.resolved_at) rows.push([({ CONFIRMED: "Buyer confirmed delivery", AUTO_COMPLETED: "Completed automatically", LAPSED: "Lapsed without a dispute", CANCELLED: "Cancelled by the vendor", OFFER_EXPIRED: "Offer expired" })[d.outcome] || "Ruling: " + dealTone(d)[1], d.resolved_at, ""]);

}

/* ---------- router ---------- */
const TABS = [["", "home", "Home"], ["groups", "groups", "Groups"], ["deals", "deals", "Deals"], ["sell", "bag", "Sell"], ["account", "user", "Account"]];
function drawTabs(cur) {
  put($("tabs"), TABS.map(([k, ic, label]) => h("li", {}, h("a", { class: "tab", href: "#/" + k, "aria-current": cur === k || (k === "groups" && cur === "group") || (k === "deals" && cur === "deal") || (k === "sell" && cur === "start") ? "page" : null }, icon(ic, 22), label))));
}
let routeTok = 0, lastAccount = null;
async function route() {
  const tok = ++routeTok;
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, query] = raw.split("?");
  const parts = path.split("/").filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const q = new URLSearchParams(query || "");
  const root = $("app");
  drawTabs(parts[0] || "");
  window.scrollTo(0, 0);
  if (gate(root)) return;
  if (!state.params) { put(root, skel(200)); await boot(); if (tok !== routeTok) return; if (gate(root)) return; }
  await loadMe();
  if (tok !== routeTok) return;
  try {
    const r = parts[0] || "";
    if (r === "") await viewHome(root, tok);
    else if (r === "groups") await viewGroups(root, q, tok);
    else if (r === "group" && parts[1]) await viewGroup(root, parts[1].toLowerCase(), tok);
    else if (r === "start") await viewStart(root, tok);
    else if (r === "sell") await viewSell(root, (parts[1] || "").toLowerCase(), tok);
    else if (r === "deals") await viewDeals(root, q, tok);
    else if (r === "deal" && parts[1]) await viewDeal(root, parts[1], tok);
    else if (r === "account") await viewAccount(root, tok);
    else put(root, h("div", { class: "panel" }, empty("Page not found", "That address does not exist.", h("a", { class: "btn btn-primary", href: "#/", text: "Go home" }))));
  } catch (e) {
    if (tok !== routeTok) return;
    put(root, h("div", { class: "panel stack measure", role: "alert" }, h("h1", { text: "Something went wrong" }), h("p", { class: "muted", text: explain(e) }), h("button", { class: "btn btn-primary", type: "button", text: "Try again", onclick: () => route() })));
  }
  if (tok === routeTok) $("app").focus({ preventScroll: true });
}
window.addEventListener("hashchange", route);
if (readTestKey()) { try { startTestSession(true); } catch (e) {} }
drawWallet();
{
  const b = $("envBadge");
  b.hidden = false; b.textContent = CHAIN_NAME;
}
boot().then(route);
(async () => {
  try {
    const mod = await import("https://esm.sh/@farcaster/miniapp-sdk@latest");
    const sdk = mod.sdk || mod.default;
    if (await sdk.isInMiniApp?.()) {
      miniProvider = await sdk.wallet.getEthereumProvider();
      await sdk.actions.ready();
      if (miniProvider && !account) {
        const accs = await miniProvider.request({ method: "eth_accounts" }).catch(() => []);
        if (accs[0]) { provider = miniProvider; account = accs[0]; usingInjected = true; walletKind = "injected"; walletClient = createWalletClient({ account, chain: CHAIN, transport: custom(provider) }); hookProvider(provider); await checkChain(); route(); }
      }
    }
  } catch (e) {}
})();
